# Site settings
title: Fancy Footage Club
email: ffc@trimm.co
description: 'Cinema-quality footage for creative projects of every size'
baseurl: ""
# Footage lives in Kevin HG's Cloudflare R2 bucket since 2026-10, copied key-for-key
# from the original S3 bucket `fancyfootageclips` (loops/... and website/...).
dlurl: "https://media.ffc.kevinhg.com/loops/"
asseturl: "https://media.ffc.kevinhg.com/website/"
url: "" 

exclude: ['css/src', 'package.json', '/node_modules', 'gruntfile.js', 'npm-debug.log', 'README.md', 'vercel.json']

defaults:
  -
    scope:
      path: ""
      type: "posts"
    values: 
      permalink: library/:year/:month/:title/

# Build settings
markdown: kramdown
sass_dir: css/_sass
