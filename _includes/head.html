<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no">
	<title>
		{% if page.type == 'preview' %}
			{% if page.is_ad != true %}
				{{ page.loop | capitalize }} by {{site.data.contributors[page.contributor].name}} - {{ site.title }}
			{% else %}
				Sponsored by {{site.data.sponsors[page.sponsor].name}} - {{ site.title }}
			{% endif %}
		{% else %}
			{% if page.title %}
				{{ page.title }} - {{ site.title }}
			{% else %}
				{{ site.title }}
			{% endif %}
		{% endif %}
	</title>
	<meta name="description" content="{% if page.excerpt %}{{ page.excerpt | strip_html | strip_newlines | truncate: 160 }}{% else %}{{ site.description }}{% endif %}">

	<link rel="stylesheet" href="{{ '/css/main.min.css' | prepend: site.baseurl }}">

	<link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

	{% include favicons.html %}
</head>
